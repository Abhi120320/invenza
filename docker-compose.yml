services:
  db:
    image: postgres:14-alpine
    container_name: invenza-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: invenza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invenza"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: invenza-backend
    ports:
      - "8000:8000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/invenza
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SECRET_KEY=change-this-to-a-random-secret-key-in-production
      - APP_ENV=development
      - FRONTEND_URL=http://localhost:5174
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=invenzaxodo@gmail.com
      - SMTP_PASSWORD=msel aeah taoo vdtx
      - EMAILS_FROM_EMAIL=invenzaxodo@gmail.com
      - EMAILS_FROM_NAME=Invenza
      - RAZORPAY_KEY_ID=rzp_test_TvmS8r4oOuHudO
      - RAZORPAY_KEY_SECRET=EprfME2muemJ0YxXGGWUh3gq

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # For production, you might pass args for VITE_API_URL if needed
    container_name: invenza-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  postgres_data:
