# Server
server.port=8000

# PostgreSQL Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invenza}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:password}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Properties
app.jwt.secret=${SECRET_KEY:invenza-super-secret-jwt-signing-key-production-ready-256-bit}
app.jwt.access-token-expire-minutes=30
app.jwt.refresh-token-expire-days=7

# Mail Settings
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Application Custom Properties
app.env=${APP_ENV:development}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.emails.from-email=${EMAILS_FROM_EMAIL:invenzaxodo@gmail.com}
app.emails.from-name=${EMAILS_FROM_NAME:Invenza}

# File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Razorpay Payment Gateway (Test Mode)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TvmS8r4oOuHudO}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:EprfME2muemJ0YxXGGWUh3gq}

